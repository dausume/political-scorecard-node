# ==============================================================================
# POLITICAL SCORECARD - STANDALONE DOCKER COMPOSE
# ==============================================================================
#
# IMPORTANT: Choose ONE mode to run - do NOT mix:
#   - STANDALONE MODE: Run from political-scorecard-node/ using THIS file
#   - SUITE MODE: Run from polari-suite/ using the parent docker-compose.yml
#
# Running both will cause container name conflicts!
#
# This file runs PSC independently with its own proxy, Keycloak, and databases.
# For running PSC alongside PRF, use the suite-level docker-compose instead.
#
# ==============================================================================
# PORTS
# ==============================================================================
#   - Frontend HTTP:     localhost:4200
#   - Backend HTTP:      localhost:8580
#   - Keycloak:          localhost:8080 (HTTP), localhost:8443 (HTTPS)
#   - PSC Proxy HTTPS:   localhost:2053 (frontend), localhost:2083 (backend)
#   - MariaDB:           localhost:3306
#   - Redis:             localhost:6379
#
# ==============================================================================
# DATABASE
# ==============================================================================
# Uses consolidated MariaDB with separate databases:
#   - Database: keycloak (user: kc)
#   - Databases: psc, psc_scoring_db, psc_location_db (user: psc-scorecard-server)
# ==============================================================================

services:
  # ============================================
  # SHARED DATABASE SERVICES
  # ============================================

  # Consolidated MariaDB - serves both Keycloak and PSC
  pol-mariadb:
    build:
      context: ../pol-mariadb
      dockerfile: Dockerfile
    container_name: pol-mariadb
    image: pol-mariadb:latest
    restart: always
    ports:
      - "3306:3306"
    networks:
      - psc-network
    env_file:
      - ../pol-mariadb/mariadb.env
    volumes:
      - pol_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend Cache - Redis
  psc-redis:
    build: ./political-scorecard-backend/redis
    container_name: psc-redis
    image: psc-redis:latest
    ports:
      - "6379:6379"
    volumes:
      - psc_redis_data:/data
    networks:
      - psc-network

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  # Frontend - Angular Application
  political-scorecard-frontend:
    build:
      context: ./political-scorecard-frontend
      dockerfile: Dockerfile
    container_name: psc-frontend
    image: psc-frontend:latest
    networks:
      - psc-network
    volumes:
      - ./political-scorecard-frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    # Run as the HOST user so files written through the source bind mount
    # (.angular/ cache etc.) stay host-owned instead of root-owned. HOME gives
    # the mapped user a writable npm/ng home inside the container.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/tmp/npmhome
    env_file:
      - ./political-scorecard-frontend/.env
    command: npm run start
    depends_on:
      - political-scorecard-backend

  # Backend - Spring Boot Application
  political-scorecard-backend:
    build:
      context: ./political-scorecard-backend
      dockerfile: Dockerfile.suite
    container_name: psc-backend
    image: psc-backend:latest
    ports:
      - "8580:8080"
    networks:
      - psc-network
    environment:
      # Database connection to consolidated MariaDB
      - SPRING_DATASOURCE_URL=jdbc:mariadb://pol-mariadb:3306/psc
      - SPRING_DATASOURCE_USERNAME=psc-scorecard-server
      - SPRING_DATASOURCE_PASSWORD=pscpassword
      - HOME=/tmp/mvnhome   # writable Maven home for the non-root mapped user
    volumes:
      - ./political-scorecard-backend:/app
    # Run as the HOST user so Maven's target/ lands host-owned through the
    # bind mount — as root it left root-owned target/ that broke host-native
    # builds with "Permission denied".
    user: "${UID:-1000}:${GID:-1000}"
    command: ./startup_shell/dev_startup_shell.sh
    depends_on:
      pol-mariadb:
        condition: service_healthy
      psc-redis:
        condition: service_started

  # ============================================
  # AUTHENTICATION SERVICES
  # ============================================

  # Keycloak - Authentication Server
  pol-keycloak:
    build:
      context: ../pol-keycloak
      dockerfile: Dockerfile.pol-kc
    container_name: pol-keycloak
    image: pol-keycloak:latest
    ports:
      - "8080:8080"   # HTTP port
      - "8443:8443"   # HTTPS port
      - "9990:9990"   # Management port
    networks:
      - psc-network
    env_file:
      - ../pol-keycloak/keycloak-admin.env
    volumes:
      - ../pol-keycloak/environments/keycloak-suite.conf:/opt/keycloak/conf/keycloak.conf
    depends_on:
      pol-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]

  # ============================================
  # PROXY SERVICES
  # ============================================

  # Nginx Reverse Proxy
  psc-proxy:
    build:
      context: ./psc-proxy
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    container_name: psc-proxy
    image: psc-proxy:latest
    ports:
      - "80:80"       # HTTP (prod)
      - "443:443"     # HTTPS (prod)
      - "2053:2053"   # HTTPS Frontend (dev - Cloudflare-compatible)
      - "2083:2083"   # HTTPS Backend API (dev - Cloudflare-compatible)
    networks:
      - psc-network
    depends_on:
      - political-scorecard-frontend
      - political-scorecard-backend
      - pol-keycloak

volumes:
  pol_mariadb_data:
  psc_redis_data:

networks:
  psc-network:
    driver: bridge
